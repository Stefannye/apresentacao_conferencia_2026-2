html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
body { display: flex; align-items: center; justify-content: center; font-family: 'Montserrat', Arial, sans-serif; }
#stage { width: 520px; height: 1000px; position: relative; flex: none; transform-origin: center center; }
.phone { position: absolute; left: 51px; top: 18px; width: 418px; height: 872px; border-radius: 64px; background: #1F2A24;
         box-shadow: 0 30px 70px rgba(0,50,25,0.28), inset 0 0 0 2px #3A4640; }
.screen { position: absolute; left: 14px; top: 14px; width: 390px; height: 844px; border-radius: 50px; overflow: hidden; background: #FBFCFA; }
.status { position: absolute; left: 0; top: 0; width: 390px; height: 47px; background: #F4F7F3; z-index: 5; }
.status .time { position: absolute; left: 44px; top: 15px; font: 600 16px 'Montserrat', Arial, sans-serif; color: #1F2A24; letter-spacing: -0.2px; }
.island { position: absolute; left: 134px; top: 11px; width: 122px; height: 34px; border-radius: 17px; background: #0E1411; z-index: 6; }
.status svg { position: absolute; top: 18px; }
.view { position: absolute; left: 0; top: 47px; width: 390px; height: 797px; overflow: hidden; }
.layer { position: absolute; left: 0; top: 0; width: 390px; height: 797px; overflow: hidden; background: #FBFCFA; }
.scroll { position: absolute; left: 0; top: 0; width: 390px; }
.scroll > img { display: block; width: 390px; }
.ov { position: absolute; }
.focus { border: 2px solid #43704A; border-radius: 9px; box-shadow: 0 0 0 4px rgba(67,112,74,0.16); box-sizing: border-box; opacity: 0; }
.typed { background: #FFFFFF; display: flex; align-items: center; padding-left: 15px; box-sizing: border-box; font: 500 15px 'Montserrat', Arial, sans-serif;
         color: #1F2A24; white-space: nowrap; overflow: hidden; opacity: 0; letter-spacing: 0.2px; }
.caret { width: 1.5px; height: 18px; background: #43704A; margin-left: 1px; }
.tap { width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(31,42,36,0.28); border: 2px solid rgba(255,255,255,0.85); opacity: 0; box-sizing: border-box; z-index: 20; }
.ring { width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 3px solid rgba(67,112,74,0.7); opacity: 0; box-sizing: border-box; z-index: 19; }
.btnload { background: #43704A; border-radius: 9px; display: flex; align-items: center; justify-content: center; gap: 10px; color: #EDF4EE;
           font: 600 15px 'Montserrat', Arial, sans-serif; opacity: 0; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid rgba(237,244,238,0.35); border-top-color: #EDF4EE; box-sizing: border-box; }
.dim { position: absolute; left: 0; top: 0; width: 390px; height: 797px; background: rgba(15,25,20,0.45); opacity: 0; z-index: 10; }
.sheet { position: absolute; left: 0; width: 390px; height: 330px; background: #FFFFFF; border-radius: 22px 22px 0 0; z-index: 11; box-shadow: 0 -10px 30px rgba(0,0,0,0.12); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: #D5D9D3; margin: 10px auto 14px; }
.sheet h4 { margin: 0 24px 10px; font: 700 17px 'Montserrat', Arial, sans-serif; color: #1F2A24; }
.opt { margin: 0 16px; padding: 14px 12px; border-bottom: 1px solid #EEF0EC; font: 500 15px 'Montserrat', Arial, sans-serif; color: #1F2A24; display: flex; justify-content: space-between; border-radius: 10px; }
.opt small { font: 500 13px 'Montserrat', Arial, sans-serif; color: #7A837D; }
.kb { position: absolute; left: 0; width: 390px; height: 291px; background: #D3D7D2; z-index: 12; padding: 8px 4px 0; box-sizing: border-box; }
.kb .row { display: flex; justify-content: center; gap: 6px; margin-bottom: 11px; }
.kb .k { height: 42px; border-radius: 6px; background: #FFFFFF; box-shadow: 0 1px 0 #8E938D; display: flex; align-items: center; justify-content: center;
         font: 400 21px -apple-system, 'Segoe UI', Arial, sans-serif; color: #111; flex: none; }
.kb .np .k { width: 120px; height: 46px; flex-direction: column; font-size: 25px; }
.kb .np .k small { font: 700 9px Arial, sans-serif; letter-spacing: 2px; margin-top: -3px; }
